name: Reklam - gunluk otomatik dagitim

on:
  schedule:
    # GitHub cron UTC. Su an LA = PDT (UTC-7). Kis (PST) 1 saat erken duser.
    - cron: '0 19 * * *'   # 12:00 LA (ogle)
    - cron: '0 0 * * *'    # 17:00 LA (okul sonrasi)
    - cron: '0 4 * * *'    # 21:00 LA (aksam prime)
  workflow_dispatch: {}     # elle test icin

permissions:
  contents: write

concurrency:
  group: reklam-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurulum (ffmpeg + font + whisper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto fontconfig
          pip install -q faster-whisper
      - name: Uret (ffmpeg) ve 4 platforma dagit
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
        run: python havuz_gunluk.py
      - name: Sahne hafizasini kaydet (tekrar onleme)
        if: always()
        run: |
          git config user.name "reklam-bot"
          git config user.email "actions@github.com"
          git add gunluk_state.json
          if git diff --cached --quiet; then echo "state degismedi"; exit 0; fi
          git commit -m "state: sahne hafizasi [skip ci]"
          git pull --rebase origin main
          git push
