name: Auto Blog Post

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

# Ayni anda iki run birbirinin commit'ini bogmasin
concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Varsayilan 6 saatlik timeout yerine hizli hata.
    # apt-get mirror'a takilirsa workflow 6 saat surup "cancelled" olmasin.
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run post generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-post.mjs