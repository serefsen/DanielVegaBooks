name: Auto Blog Post

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Generate post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit and push
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@noreply.github.com"
          git add src/data/posts.js
          if git diff --staged --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "blog: auto post $(date +%Y-%m-%d)"
            git push
          fi
