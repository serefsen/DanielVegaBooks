<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .qmark { font-family:'Lora',serif; font-size:240px; line-height:.7; color:rgba(90,99,145,.20); height:150px; }
  .qtext { font-family:'Lora',serif; font-weight:500; font-size:50px; line-height:1.4; letter-spacing:-.3px; color:#2F3550; }
  .qattr { font-weight:600; font-size:25px; letter-spacing:.5px; color:#5A6391; }
  .qrole { font-weight:400; font-size:22px; color:#8A8EA0; margin-top:6px; }
</style></head>
<body>
  <div class="pin">
    <div class="frame"></div>
    <svg class="rings rings-bl" width="500" height="500" viewBox="0 0 500 500" fill="none" stroke="rgba(90,99,145,.12)" stroke-width="1.6"><circle cx="250" cy="250" r="85"/><circle cx="250" cy="250" r="145"/><circle cx="250" cy="250" r="205"/><circle cx="250" cy="250" r="250"/></svg>

    <div style="position:absolute; left:96px; right:96px; top:300px; text-align:center;">
      <div class="qmark">&ldquo;</div>
      <div class="eyebrow" style="text-align:center; margin-bottom:46px;">{{KICKER}}</div>
      <p class="qtext">{{QUOTE}}</p>
      <div style="width:64px; height:3px; background:#5A6391; border-radius:2px; margin:48px auto 30px;"></div>
      <div class="qattr">{{ATTRIB}}</div>
      <div class="qrole">{{ROLE}}</div>
    </div>

    <div class="footer" style="text-align:center;">
      <div class="footrule" style="width:120px; margin:0 auto 30px;"></div>
      <div class="brand">Daniel Vega Books</div>
      <div class="url">danielvegabooks.com</div>
    </div>
  </div>
</body></html>
