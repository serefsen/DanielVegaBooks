<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .lqmark { font-family:'Lora',serif; font-size:170px; line-height:.7; color:rgba(246,241,232,.30); height:108px; }
  .lqtext { font-family:'Lora',serif; font-weight:500; font-size:44px; line-height:1.4; letter-spacing:-.3px; color:#F6F1E8; }
  .lqattr { font-weight:600; font-size:24px; letter-spacing:.5px; color:#F6F1E8; }
  .lqrole { font-weight:400; font-size:21px; color:#C2C7DD; margin-top:5px; }
</style></head>
<body>
  <div class="pin">
    <svg style="position:absolute; left:50%; top:128px; transform:translateX(-50%);" width="400" height="400" viewBox="0 0 400 400" fill="none">
      <circle cx="200" cy="200" r="30" fill="rgba(90,99,145,.06)"/>
      <circle cx="200" cy="200" r="48"  stroke="rgba(90,99,145,.32)" stroke-width="1.6"/>
      <circle cx="200" cy="200" r="98"  stroke="rgba(90,99,145,.24)" stroke-width="1.6"/>
      <circle cx="200" cy="200" r="150" stroke="rgba(90,99,145,.16)" stroke-width="1.6"/>
      <circle cx="200" cy="200" r="195" stroke="rgba(90,99,145,.10)" stroke-width="1.6"/>
    </svg>
    <span class="eyebrow topkick">{{KICKER}}</span>

    <div class="panel" style="height:830px;">
      <div style="position:absolute; left:96px; right:96px; top:64px;">
        <div class="lqmark">&ldquo;</div>
        <p class="lqtext" style="margin-top:6px;">{{QUOTE}}</p>
        <div style="width:60px; height:3px; background:rgba(246,241,232,.5); border-radius:2px; margin:38px 0 26px;"></div>
        <div class="lqattr">{{ATTRIB}}</div>
        <div class="lqrole">{{ROLE}}</div>
      </div>
      <div style="position:absolute; left:96px; right:96px; bottom:60px;">
        <div class="b-footrule"></div>
        <div class="b-brand">Daniel Vega Books</div>
        <div class="b-url">danielvegabooks.com</div>
      </div>
    </div>
  </div>
</body></html>
