<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .lchip { display:inline-flex; align-items:center; gap:10px; padding:13px 26px; background:rgba(246,241,232,.16); border:1.5px solid rgba(246,241,232,.5); border-radius:40px; font-weight:500; font-size:21px; color:#F6F1E8; letter-spacing:.3px; }
  .lchip .dot { width:7px; height:7px; border-radius:50%; background:#F6F1E8; opacity:.8; }
</style></head>
<body>
  <div class="pin">
    <svg style="position:absolute; left:50%; top:120px; transform:translateX(-50%);" width="430" height="430" viewBox="0 0 430 430" fill="none">
      <circle cx="215" cy="215" r="34" fill="rgba(90,99,145,.07)"/>
      <circle cx="215" cy="215" r="52"  stroke="rgba(90,99,145,.34)" stroke-width="1.7"/>
      <circle cx="215" cy="215" r="104" stroke="rgba(90,99,145,.26)" stroke-width="1.7"/>
      <circle cx="215" cy="215" r="158" stroke="rgba(90,99,145,.18)" stroke-width="1.7"/>
      <circle cx="215" cy="215" r="205" stroke="rgba(90,99,145,.11)" stroke-width="1.7"/>
    </svg>
    <span class="eyebrow topkick">{{KICKER}}</span>

    <div class="panel" style="height:790px;">
      <div style="position:absolute; left:96px; right:96px; top:70px;">
        <div style="margin-bottom:30px;"><span class="lchip"><span class="dot"></span>{{BADGE}}</span></div>
        <h1 class="b-head">{{HEADLINE}}</h1>
        <p class="b-sub" style="margin-top:30px; max-width:710px;">{{SUB}}</p>
        <div style="margin-top:40px;"><span class="b-tag">{{CTA}}</span></div>
      </div>
      <div style="position:absolute; left:96px; right:96px; bottom:60px;">
        <div class="b-footrule"></div>
        <div class="b-brand">Daniel Vega Books</div>
        <div class="b-url">danielvegabooks.com</div>
      </div>
    </div>
  </div>
</body></html>
