<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
  <div class="pin">
    <svg class="rings" style="top:-110px; right:-120px;" width="500" height="500" viewBox="0 0 500 500" fill="none" stroke="rgba(90,99,145,.20)" stroke-width="1.7"><circle cx="250" cy="250" r="90"/><circle cx="250" cy="250" r="150"/><circle cx="250" cy="250" r="210"/><circle cx="250" cy="250" r="248"/></svg>
    <span class="eyebrow topkick">{{KICKER}}</span>

    <div class="panel">
      <div style="position:absolute; left:96px; right:96px; top:78px;">
        <h1 class="b-head">{{HEADLINE}}</h1>
        <p class="b-sub" style="margin-top:34px; max-width:700px;">{{SUB}}</p>
        <div style="margin-top:42px;"><span class="b-tag">{{CTA}}</span></div>
      </div>
      <div style="position:absolute; left:96px; right:96px; bottom:64px;">
        <div class="b-footrule"></div>
        <div class="b-brand">Daniel Vega Books</div>
        <div class="b-url">danielvegabooks.com</div>
      </div>
    </div>
  </div>
</body></html>
