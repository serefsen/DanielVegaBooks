<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
  <div class="pin">
    <div class="frame"></div>
    <svg style="position:absolute; left:50%; top:84px; transform:translateX(-50%);" width="620" height="620" viewBox="0 0 620 620" fill="none">
      <circle cx="310" cy="310" r="42" fill="rgba(90,99,145,.06)"/>
      <circle cx="310" cy="310" r="62"  stroke="rgba(90,99,145,.36)" stroke-width="1.8"/>
      <circle cx="310" cy="310" r="122" stroke="rgba(90,99,145,.30)" stroke-width="1.8"/>
      <circle cx="310" cy="310" r="186" stroke="rgba(90,99,145,.23)" stroke-width="1.8"/>
      <circle cx="310" cy="310" r="250" stroke="rgba(90,99,145,.16)" stroke-width="1.8"/>
      <circle cx="310" cy="310" r="305" stroke="rgba(90,99,145,.10)" stroke-width="1.8"/>
    </svg>

    <div class="c-center">
      <div class="c-kick">{{KICKER}}</div>
      <div class="c-rule"></div>
      <h1 class="c-head">{{HEADLINE}}</h1>
      <p class="c-sub">{{SUB}}</p>
      <div><span class="c-tag">{{CTA}}</span></div>
    </div>

    <div class="c-foot">
      <div class="c-footrule"></div>
      <div class="c-brand">Daniel Vega Books</div>
      <div class="c-url">danielvegabooks.com</div>
    </div>
  </div>
</body></html>
