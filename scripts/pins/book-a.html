<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .cover { width:330px; height:495px; margin:0 auto; border-radius:6px; overflow:hidden;
           box-shadow:0 30px 70px rgba(47,53,80,.30); background:#5A6391; }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .bkchip { display:inline-flex; align-items:center; gap:10px; padding:13px 28px; background:#5A6391; border-radius:40px; font-weight:500; font-size:22px; color:#F4EFE4; }
  .bktitle { font-family:'Lora',serif; font-weight:600; font-size:56px; line-height:1.12; letter-spacing:-.5px; color:#2F3550; }
  .bksub { font-weight:400; font-size:26px; line-height:1.45; color:#6B6F86; }
</style></head>
<body>
  <div class="pin">
    <div class="frame"></div>
    <svg class="rings rings-tr" width="460" height="460" viewBox="0 0 460 460" fill="none" stroke="rgba(90,99,145,.13)" stroke-width="1.6"><circle cx="230" cy="230" r="80"/><circle cx="230" cy="230" r="135"/><circle cx="230" cy="230" r="190"/><circle cx="230" cy="230" r="228"/></svg>

    <div style="position:absolute; left:0; right:0; top:120px; text-align:center;">
      <div class="cover"><img src="{{COVER}}" alt=""></div>
    </div>

    <div style="position:absolute; left:96px; right:96px; top:712px; text-align:center;">
      <div style="margin-bottom:26px;"><span class="bkchip">{{KICKER}}</span></div>
      <h1 class="bktitle">{{TITLE}}</h1>
      <p class="bksub" style="margin-top:22px; max-width:740px; margin-left:auto; margin-right:auto;">{{SUBTITLE}}</p>
      <div style="margin-top:38px;"><span class="tag">{{CTA}}</span></div>
    </div>

    <div class="footer" style="text-align:center;">
      <div class="footrule" style="width:120px; margin:0 auto 30px;"></div>
      <div class="brand">Daniel Vega Books</div>
      <div class="url">danielvegabooks.com</div>
    </div>
  </div>
</body></html>
